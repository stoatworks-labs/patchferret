[workspace]
resolver = "2"
members = [
    "crates/patchferret-model",
    "crates/patchferret-formats",
    "crates/patchferret-report",
    "crates/patchferret-cli",
    "crates/patchferret-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/stoatworks-labs/patchferret"

[workspace.dependencies]
patchferret-model = { path = "crates/patchferret-model" }
patchferret-formats = { path = "crates/patchferret-formats" }
patchferret-report = { path = "crates/patchferret-report" }

quick-xml = "0.36"
# Pure-Rust DEFLATE. Allen & Heath shows are gzipped tars, and inflate is
# neither cheap to hand-roll nor bloaty to depend on — miniz_oxide is no_std
# capable and compiles to wasm32-unknown-unknown, which the C-backed zlib
# bindings do not.
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
thiserror = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
