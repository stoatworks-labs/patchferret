# Build the site and put it in front of visitors.
#
# Until this existed, patchferret shipped only when somebody remembered to run
# `cf-run npx wrangler deploy` from a laptop. That last happened on 2026-08-21, leaving 2 commits unserved by 2026-09-07.
#
# Deliberately the same shape as the rest of the fleet's deploy.yml, so a fix to
# one is obvious in the others. See negative-space for the original.

name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/dependabot.yml"
  workflow_dispatch:

# Newest push wins. Cancelling an in-flight build is safe: wrangler uploads the
# assets first and activates the version as one step at the end, so a run killed
# part way through never becomes the live version.
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Fail in a second rather than after a build. A deploy that cannot
      # authenticate is the whole point of this job failing to happen.
      - name: Check the Cloudflare token is present
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set on this repository, so the"
            echo "::error::site cannot be deployed. Create a Cloudflare API token with"
            echo "::error::the 'Edit Cloudflare Workers' template scoped to this account,"
            echo "::error::then:"
            echo "::error::  gh secret set CLOUDFLARE_API_TOKEN --repo stoatworks-labs/patchferret"
            echo "::error::cf-run already uses such a token from the login keychain under"
            echo "::error::the service name 'stoatworks-cloudflare'; the same one works here."
            exit 1
          fi
          echo "token present - ok"

      # The page and its loader are committed at web/, but the core they load is
      # Rust compiled to wasm32 and gitignored — exactly the artefact
      # wrangler.toml warns a fresh clone must build first. Until 2026-09-15
      # this job had no build step at all, so every Actions deploy since it
      # took over from the laptop shipped a page whose core 404'd, and the
      # smoke-check below passed because the page reports that failure in its
      # own DOM rather than throwing. Same toolchain steps as ci.yml's wasm job.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Build the WASM core
        run: |
          set -euo pipefail
          ./scripts/build-web.sh
          # A missing or empty file is what this job used to ship. The magic
          # number check is what stops a stray text file passing as the core.
          test -s web/patchferret.wasm
          magic=$(head -c 4 web/patchferret.wasm | od -An -tx1 | tr -d ' \n')
          if [ "$magic" != "0061736d" ]; then
            echo "::error::web/patchferret.wasm does not start with the wasm magic number (got $magic)"
            exit 1
          fi
          echo "core built: $(wc -c < web/patchferret.wasm | tr -d ' ') bytes"

      # With the core in place the smoke-check exercises the real load path: the
      # page fetches ./patchferret.wasm from the served directory, so a broken
      # core now fails here instead of on the live host.

      - name: Smoke-check the site
        uses: stoatworks-labs/smoke-check@v1
        with:
          dir: web
          root: body
          min-text: "0"

      # wrangler is pinned rather than left to resolve to latest: an unpinned npx
      # would let a wrangler major change how deploys behave on a morning nobody
      # touched this repo. Dependabot's github-actions ecosystem only bumps `uses:`
      # refs, never a version inside a `run:`, so bump this deliberately.
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.116.0 deploy

      # Prove it actually landed, against the domain a visitor uses. The whole body
      # cannot be compared: Cloudflare injects a bot-management script before
      # </body> carrying a per-request nonce, so no two responses are identical.
      # The <head> is untouched by that injection and carries the hashed asset
      # names, so it moves for a code change and a meta-only change alike.
      #
      # The grep is not belt-and-braces. A page with no </head> at all — flock's
      # hand-written demo is one — makes the sed print the whole document, which
      # then DOES include Cloudflare's injected script and its per-request nonce,
      # and the hash comes out different on every attempt. Dropping that one line
      # makes the comparison work whether the page closes its head or not.
      #
      # -F is load-bearing: without it grep reads the $ signs as end-of-line
      # anchors and the pattern matches nothing at all, so the filter silently
      # does nothing. It looked like it worked only because GitHub's runners do
      # not get served the challenge script in the first place.
      - name: Check the live site is serving this build
        run: |
          set -euo pipefail
          want=$(sed -n '1,/<\/head>/p' web/index.html \
                 | grep -vF '__CF$cv$params' | shasum -a 256 | cut -d' ' -f1)
          echo "expecting the live <head> to hash to $want"
          for attempt in 1 2 3 4 5; do
            got=$(curl -sS --max-time 30 "https://patchferret.stoatworks-labs.com/" \
                  | sed -n '1,/<\/head>/p' | grep -vF '__CF$cv$params' \
                  | shasum -a 256 | cut -d' ' -f1 || true)
            if [ "$got" = "$want" ]; then
              echo "live site is serving this build (attempt $attempt)"
              exit 0
            fi
            echo "not there yet, got $got — retrying in 10s (attempt $attempt)"
            sleep 10
          done
          echo "::error::Deployed, but https://patchferret.stoatworks-labs.com/ is still not serving this"
          echo "::error::build's <head>. The upload succeeded, so this is the edge"
          echo "::error::serving something else — check the Worker's routes, and that"
          echo "::error::patchferret is what the custom domain actually points at."
          exit 1

      # The <head> hash says the page landed; this says the core did. It is the
      # check that would have caught the missing build step on the first deploy.
      - name: Check the live site is serving the core
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/core.wasm -w '%{http_code}' --max-time 60 \
                   "https://patchferret.stoatworks-labs.com/patchferret.wasm" || true)
            magic=$(head -c 4 /tmp/core.wasm 2>/dev/null | od -An -tx1 | tr -d ' \n' || true)
            if [ "$code" = "200" ] && [ "$magic" = "0061736d" ]; then
              echo "live core is a wasm module, $(wc -c < /tmp/core.wasm | tr -d ' ') bytes (attempt $attempt)"
              exit 0
            fi
            echo "not there yet: HTTP $code, magic '$magic' — retrying in 10s (attempt $attempt)"
            sleep 10
          done
          echo "::error::The page deployed but https://patchferret.stoatworks-labs.com/patchferret.wasm"
          echo "::error::is not a wasm module. The core is what the page loads first; without it"
          echo "::error::every visitor sees 'core failed to load'."
          exit 1
